name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      require_live_microsoft:
        description: Fail unless the read-only Microsoft live smoke actually passes
        type: boolean
        default: false
      run_live_write:
        description: Run the live write test against the test site (writes, then cleans up)
        type: boolean
        default: false
      live_write_site_id:
        description: Graph site id the live write test may write to (falls back to the MICROSOFT_SITE_ID secret)
        type: string
        default: ""
      run_live_coverage:
        description: Call every read rpc against the test site and print each call's outcome (read-only)
        type: boolean
        default: false
      live_coverage_admin:
        description: Run the read-only coverage with the admin app's certificate instead of the test app
        type: boolean
        default: false
      run_live_admin:
        description: Read the test site's app grants with the admin app and dry-run an ensure (changes nothing)
        type: boolean
        default: false
      live_admin_change:
        description: With run_live_admin, also grant, change and revoke a grant for the admin app itself on the test site
        type: boolean
        default: false
      live_admin_set_role:
        description: With run_live_admin, set the test app's role on the test site (read, write, manage or full_control)
        type: string
        default: ""
      import_recordings_run_id:
        description: Commit the recordings artifact of this run id to the branch as replay data
        type: string
        default: ""

# The shared core (ai-pipestream/grpc-integration) is checked out next to
# this repo and included as a Gradle composite build (-PintegrationDir), so
# CI never needs the Forgejo registry. Both checkouts live under the
# workspace: actions/checkout cannot write outside it.
env:
  INTEGRATION_REF: main
  # The one site the test app is granted (Sites.Selected).
  LIVE_SITE_ID: pipestreamai.sharepoint.com,fb9e55f0-f996-4b01-93a9-20cdd1ba2251,e0a5a4ab-7a5e-425e-a1ea-1481b59df538

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: grpc-microsoft
      - name: Test live gate branches offline
        run: python3 scripts/test_microsoft_live_gate.py
        working-directory: grpc-microsoft
      - id: core
        name: Pick the grpc-integration ref (same branch if it exists, else main)
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          if git ls-remote --exit-code --heads https://github.com/ai-pipestream/grpc-integration "$BRANCH" >/dev/null; then
            echo "ref=$BRANCH" >> "$GITHUB_OUTPUT"
          else
            echo "ref=$INTEGRATION_REF" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v5
        with:
          repository: ai-pipestream/grpc-integration
          ref: ${{ steps.core.outputs.ref }}
          path: grpc-integration
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - run: ./gradlew --no-daemon build -PintegrationDir=../grpc-integration
        working-directory: grpc-microsoft

  buf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: bufbuild/buf-setup-action@v1
        with:
          version: "1.54.0"
          # Authenticated release lookups; anonymous ones get rate-limited
          # and fail before lint runs.
          github_token: ${{ github.token }}
      - name: buf lint STANDARD+COMMENTS
        run: buf lint

  # Fork PRs never enter either credential-bearing job. Optional runs report
  # missing credentials explicitly; dispatch can require actual live evidence.
  live-microsoft-preflight:
    needs: build
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.credentials.outputs.ready }}
    steps:
      - name: Check live credentials without printing them
        id: credentials
        env:
          MICROSOFT_TENANT_ID: ${{ secrets.MICROSOFT_TENANT_ID }}
          MICROSOFT_CLIENT_ID: ${{ secrets.MICROSOFT_CLIENT_ID }}
          MICROSOFT_CLIENT_SECRET: ${{ secrets.MICROSOFT_CLIENT_SECRET }}
          REQUIRE_LIVE: ${{ github.event_name == 'workflow_dispatch' && inputs.require_live_microsoft }}
        shell: bash
        run: |
          if [[ -z "${MICROSOFT_TENANT_ID//[[:space:]]/}" || -z "${MICROSOFT_CLIENT_ID//[[:space:]]/}" || -z "${MICROSOFT_CLIENT_SECRET//[[:space:]]/}" ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            if [[ "$REQUIRE_LIVE" == "true" ]]; then
              echo "::error::Required Microsoft live gate has no credentials; no live evidence produced."
              echo "Microsoft live gate: FAILED (required credentials missing; no live evidence)." >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            echo "Microsoft live smoke: SKIPPED (credentials missing; no live evidence)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

  live-microsoft:
    needs: live-microsoft-preflight
    if: needs.live-microsoft-preflight.outputs.ready == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: grpc-microsoft
      - id: core
        name: Pick the grpc-integration ref (same branch if it exists, else main)
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          if git ls-remote --exit-code --heads https://github.com/ai-pipestream/grpc-integration "$BRANCH" >/dev/null; then
            echo "ref=$BRANCH" >> "$GITHUB_OUTPUT"
          else
            echo "ref=$INTEGRATION_REF" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v5
        with:
          repository: ai-pipestream/grpc-integration
          ref: ${{ steps.core.outputs.ref }}
          path: grpc-integration
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - name: Live Microsoft Graph smoke
        working-directory: grpc-microsoft
        env:
          MICROSOFT_TENANT_ID: ${{ secrets.MICROSOFT_TENANT_ID }}
          MICROSOFT_CLIENT_ID: ${{ secrets.MICROSOFT_CLIENT_ID }}
          MICROSOFT_CLIENT_SECRET: ${{ secrets.MICROSOFT_CLIENT_SECRET }}
          MICROSOFT_SITE_ID: ${{ env.LIVE_SITE_ID }}
        run: |
          ./gradlew --no-daemon -PintegrationDir=../grpc-integration :grpc-microsoft-service:liveSmokeTest --rerun-tasks
      - name: Require executed live evidence
        working-directory: grpc-microsoft
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET

          report = Path("grpc-microsoft-service/build/test-results/liveSmokeTest/TEST-ai.pipestream.microsoft.MicrosoftLiveSmokeIT.xml")
          if not report.is_file():
              raise SystemExit("Missing Microsoft live smoke report; no live evidence.")
          cases = ET.parse(report).getroot().findall("testcase")
          if not cases or any(case.find(tag) is not None for case in cases for tag in ("skipped", "failure", "error")):
              raise SystemExit("Microsoft live smoke did not execute successfully; no live evidence.")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write(f"Microsoft live smoke: PASSED ({len(cases)} executed tests, none skipped).\n")
          PYTHON

  # Manual only, read-only: every read rpc against the test site. The log of a
  # public repository gets each call's label and outcome, never its detail.
  live-microsoft-coverage:
    if: github.event_name == 'workflow_dispatch' && inputs.run_live_coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: grpc-microsoft
      - uses: actions/checkout@v5
        with:
          repository: ai-pipestream/grpc-integration
          ref: ${{ env.INTEGRATION_REF }}
          path: grpc-integration
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - name: Live Microsoft Graph coverage run
        working-directory: grpc-microsoft
        env:
          MICROSOFT_TENANT_ID: ${{ secrets.MICROSOFT_TENANT_ID }}
          MICROSOFT_CLIENT_ID: ${{ inputs.live_coverage_admin && secrets.MICROSOFT_ADMIN_CLIENT_ID || secrets.MICROSOFT_CLIENT_ID }}
          MICROSOFT_CLIENT_SECRET: ${{ inputs.live_coverage_admin && secrets.MICROSOFT_ADMIN_CLIENT_SECRET || secrets.MICROSOFT_CLIENT_SECRET }}
          MICROSOFT_CLIENT_CERT_PEM: ${{ inputs.live_coverage_admin && secrets.MICROSOFT_ADMIN_CLIENT_CERT_PEM || secrets.MICROSOFT_CLIENT_CERT_PEM }}
          MICROSOFT_SITE_ID: ${{ inputs.live_write_site_id || env.LIVE_SITE_ID }}
          MICROSOFT_DRIVE_IDS: ${{ secrets.MICROSOFT_DRIVE_IDS }}
        run: |
          status=0
          ./gradlew --no-daemon -PintegrationDir=../grpc-integration :grpc-microsoft-service:liveCoverageTest --rerun-tasks > "$RUNNER_TEMP/coverage.log" 2>&1 || status=$?
          report=grpc-microsoft-service/build/live-coverage.md
          if [ -f "$report" ]; then
            grep -E '^- Calls:' "$report" || true
            awk -F ' \\| ' '/^## RPCs/ { on = 1; next } /^## / { on = 0 } on && /^\| / { print $1 " | " $2 }' "$report"
          else
            echo "::error::no coverage report was written"
            grep -E '^(BUILD|FAILURE|> Task|e: |.*error:)' "$RUNNER_TEMP/coverage.log" | tail -n 30 || true
          fi
          exit "$status"

  # Manual only: the admin service reads the test site's grants and dry-runs an
  # ensure. It changes grants only when live_admin_change or live_admin_set_role is set.
  live-microsoft-admin:
    if: github.event_name == 'workflow_dispatch' && inputs.run_live_admin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: grpc-microsoft
      - uses: actions/checkout@v5
        with:
          repository: ai-pipestream/grpc-integration
          ref: ${{ env.INTEGRATION_REF }}
          path: grpc-integration
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - name: Live admin service read and dry run
        working-directory: grpc-microsoft
        env:
          MICROSOFT_TENANT_ID: ${{ secrets.MICROSOFT_TENANT_ID }}
          MICROSOFT_ADMIN_CLIENT_ID: ${{ secrets.MICROSOFT_ADMIN_CLIENT_ID }}
          MICROSOFT_ADMIN_CLIENT_CERT_PEM: ${{ secrets.MICROSOFT_ADMIN_CLIENT_CERT_PEM }}
          MICROSOFT_CLIENT_ID: ${{ secrets.MICROSOFT_CLIENT_ID }}
          MICROSOFT_SITE_ID: ${{ env.LIVE_SITE_ID }}
          MICROSOFT_ADMIN_LIVE_CHANGE: ${{ inputs.live_admin_change && '1' || '' }}
          MICROSOFT_ADMIN_LIVE_SET_ROLE: ${{ inputs.live_admin_set_role }}
        run: |
          for name in MICROSOFT_TENANT_ID MICROSOFT_ADMIN_CLIENT_ID MICROSOFT_ADMIN_CLIENT_CERT_PEM MICROSOFT_CLIENT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not set; the live admin run needs it"
              exit 1
            fi
          done
          status=0
          ./gradlew --no-daemon -PintegrationDir=../grpc-integration :grpc-microsoft-admin:liveAdminTest --rerun-tasks > "$RUNNER_TEMP/admin.log" 2>&1 || status=$?
          grep -F '[MicrosoftAdminLiveIT]' "$RUNNER_TEMP/admin.log" || true
          grep -E '^(BUILD|FAILURE)' "$RUNNER_TEMP/admin.log" || true
          exit "$status"

  # Manual only: writes to the test site, then deletes what it created.
  live-microsoft-write:
    if: github.event_name == 'workflow_dispatch' && inputs.run_live_write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: grpc-microsoft
      - uses: actions/checkout@v5
        with:
          repository: ai-pipestream/grpc-integration
          ref: ${{ env.INTEGRATION_REF }}
          path: grpc-integration
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - name: Live Microsoft Graph write test
        working-directory: grpc-microsoft
        env:
          MICROSOFT_TENANT_ID: ${{ secrets.MICROSOFT_TENANT_ID }}
          MICROSOFT_CLIENT_ID: ${{ secrets.MICROSOFT_CLIENT_ID }}
          MICROSOFT_CLIENT_SECRET: ${{ secrets.MICROSOFT_CLIENT_SECRET }}
          MICROSOFT_CLIENT_CERT_PEM: ${{ secrets.MICROSOFT_CLIENT_CERT_PEM }}
          MICROSOFT_SITE_ID: ${{ inputs.live_write_site_id || env.LIVE_SITE_ID }}
          MICROSOFT_DRIVE_IDS: ${{ secrets.MICROSOFT_DRIVE_IDS }}
          MICROSOFT_LIVE_WRITE: "1"
        run: |
          for name in MICROSOFT_TENANT_ID MICROSOFT_CLIENT_ID MICROSOFT_CLIENT_SECRET MICROSOFT_SITE_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not set; the live write run needs it"
              exit 1
            fi
          done
          ./gradlew --no-daemon -PintegrationDir=../grpc-integration :grpc-microsoft-service:liveWriteTest --rerun-tasks
      - name: Publish the report
        if: always()
        working-directory: grpc-microsoft
        run: |
          if [ -f grpc-microsoft-service/build/live-write.md ]; then
            cat grpc-microsoft-service/build/live-write.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-write
          path: |
            grpc-microsoft/grpc-microsoft-service/build/live-write.md
            grpc-microsoft/grpc-microsoft-service/build/test-results/liveWriteTest/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recordings
          path: grpc-microsoft/grpc-microsoft-service/src/test/resources/recordings/microsoft/
          if-no-files-found: ignore

  # Copies the recordings a live write run uploaded into the branch, after a
  # leak check and the recordings hygiene test. Only ever started by hand.
  import-microsoft-recordings:
    if: github.event_name == 'workflow_dispatch' && inputs.import_recordings_run_id != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v5
        with:
          path: grpc-microsoft
      - uses: actions/checkout@v5
        with:
          repository: ai-pipestream/grpc-integration
          ref: ${{ env.INTEGRATION_REF }}
          path: grpc-integration
      - name: Drop the previous recordings
        run: rm -rf grpc-microsoft/grpc-microsoft-service/src/test/resources/recordings/microsoft
      - uses: actions/download-artifact@v4
        with:
          name: recordings
          run-id: ${{ inputs.import_recordings_run_id }}
          github-token: ${{ github.token }}
          path: grpc-microsoft/grpc-microsoft-service/src/test/resources/recordings/microsoft/
      - name: Leak check
        working-directory: grpc-microsoft/grpc-microsoft-service/src/test/resources/recordings/microsoft
        run: |
          echo "files: $(find . -type f | wc -l)"
          fail=0
          check() {
            n=$(grep -rIlE -e "$2" . | wc -l)
            echo "$1: $n files"
            if [ "$n" -gt 0 ]; then grep -rIlE -e "$2" . | head -20; fail=1; fi
          }
          check "jwt" 'eyJ[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}'
          check "bearer credential" 'Bearer [A-Za-z0-9._-]{16,}'
          check "client secret field" 'client_secret'
          check "tenant host" 'pipestreamai'
          # OData annotation keys such as fields@odata.context have the shape of an address.
          n=$(grep -rIhoE '[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}' . | grep -vE '@(odata|microsoft\.graph)\.[A-Za-z.]+$' | grep -vcE '@example\.(invalid|com|org)$' || true)
          echo "email address: $n matches outside the placeholder domains"
          if [ "$n" -gt 0 ]; then fail=1; fi
          exit $fail
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - name: Hygiene test on the imported recordings
        working-directory: grpc-microsoft
        run: |
          ./gradlew --no-daemon -PintegrationDir=../grpc-integration :grpc-microsoft-service:test \
            --tests '*RecordingsHygieneTest'
      - name: Commit the recordings
        working-directory: grpc-microsoft
        env:
          BRANCH: ${{ github.ref_name }}
          RUN_ID: ${{ inputs.import_recordings_run_id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add grpc-microsoft-service/src/test/resources/recordings
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "Add recorded Graph write exchanges from live run ${RUN_ID}"
          git push origin "HEAD:${BRANCH}"
