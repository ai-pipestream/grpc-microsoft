name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      require_live_microsoft:
        description: Fail unless the read-only Microsoft live smoke actually passes
        type: boolean
        default: false
      run_live_write:
        description: Run the live write test against the test site (writes, then cleans up)
        type: boolean
        default: false

# The shared core (ai-pipestream/grpc-integration) is checked out next to
# this repo and included as a Gradle composite build (-PintegrationDir), so
# CI never needs the Forgejo registry. Both checkouts live under the
# workspace: actions/checkout cannot write outside it.
env:
  INTEGRATION_REF: main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: grpc-microsoft
      - name: Test live gate branches offline
        run: python3 scripts/test_microsoft_live_gate.py
        working-directory: grpc-microsoft
      - id: core
        name: Pick the grpc-integration ref (same branch if it exists, else main)
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          if git ls-remote --exit-code --heads https://github.com/ai-pipestream/grpc-integration "$BRANCH" >/dev/null; then
            echo "ref=$BRANCH" >> "$GITHUB_OUTPUT"
          else
            echo "ref=$INTEGRATION_REF" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v5
        with:
          repository: ai-pipestream/grpc-integration
          ref: ${{ steps.core.outputs.ref }}
          path: grpc-integration
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - run: ./gradlew --no-daemon build -PintegrationDir=../grpc-integration
        working-directory: grpc-microsoft

  buf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: bufbuild/buf-setup-action@v1
        with:
          version: "1.54.0"
          # Authenticated release lookups; anonymous ones get rate-limited
          # and fail before lint runs.
          github_token: ${{ github.token }}
      - name: buf lint STANDARD+COMMENTS
        run: buf lint

  # Fork PRs never enter either credential-bearing job. Optional runs report
  # missing credentials explicitly; dispatch can require actual live evidence.
  live-microsoft-preflight:
    needs: build
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.credentials.outputs.ready }}
    steps:
      - name: Check live credentials without printing them
        id: credentials
        env:
          MICROSOFT_TENANT_ID: ${{ secrets.MICROSOFT_TENANT_ID }}
          MICROSOFT_CLIENT_ID: ${{ secrets.MICROSOFT_CLIENT_ID }}
          MICROSOFT_CLIENT_SECRET: ${{ secrets.MICROSOFT_CLIENT_SECRET }}
          REQUIRE_LIVE: ${{ github.event_name == 'workflow_dispatch' && inputs.require_live_microsoft }}
        shell: bash
        run: |
          if [[ -z "${MICROSOFT_TENANT_ID//[[:space:]]/}" || -z "${MICROSOFT_CLIENT_ID//[[:space:]]/}" || -z "${MICROSOFT_CLIENT_SECRET//[[:space:]]/}" ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            if [[ "$REQUIRE_LIVE" == "true" ]]; then
              echo "::error::Required Microsoft live gate has no credentials; no live evidence produced."
              echo "Microsoft live gate: FAILED (required credentials missing; no live evidence)." >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            echo "Microsoft live smoke: SKIPPED (credentials missing; no live evidence)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

  live-microsoft:
    needs: live-microsoft-preflight
    if: needs.live-microsoft-preflight.outputs.ready == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: grpc-microsoft
      - id: core
        name: Pick the grpc-integration ref (same branch if it exists, else main)
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          if git ls-remote --exit-code --heads https://github.com/ai-pipestream/grpc-integration "$BRANCH" >/dev/null; then
            echo "ref=$BRANCH" >> "$GITHUB_OUTPUT"
          else
            echo "ref=$INTEGRATION_REF" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v5
        with:
          repository: ai-pipestream/grpc-integration
          ref: ${{ steps.core.outputs.ref }}
          path: grpc-integration
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - name: Live Microsoft Graph smoke
        working-directory: grpc-microsoft
        env:
          MICROSOFT_TENANT_ID: ${{ secrets.MICROSOFT_TENANT_ID }}
          MICROSOFT_CLIENT_ID: ${{ secrets.MICROSOFT_CLIENT_ID }}
          MICROSOFT_CLIENT_SECRET: ${{ secrets.MICROSOFT_CLIENT_SECRET }}
          MICROSOFT_SITE_ID: ${{ secrets.MICROSOFT_SITE_ID }}
          MICROSOFT_DRIVE_IDS: ${{ secrets.MICROSOFT_DRIVE_IDS }}
        run: |
          ./gradlew --no-daemon -PintegrationDir=../grpc-integration :grpc-microsoft-service:liveSmokeTest --rerun-tasks
      - name: Require executed live evidence
        working-directory: grpc-microsoft
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET

          report = Path("grpc-microsoft-service/build/test-results/liveSmokeTest/TEST-ai.pipestream.microsoft.MicrosoftLiveSmokeIT.xml")
          if not report.is_file():
              raise SystemExit("Missing Microsoft live smoke report; no live evidence.")
          cases = ET.parse(report).getroot().findall("testcase")
          if not cases or any(case.find(tag) is not None for case in cases for tag in ("skipped", "failure", "error")):
              raise SystemExit("Microsoft live smoke did not execute successfully; no live evidence.")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write(f"Microsoft live smoke: PASSED ({len(cases)} executed tests, none skipped).\n")
          PYTHON

  # Manual only: writes to the test site, then deletes what it created.
  live-microsoft-write:
    if: github.event_name == 'workflow_dispatch' && inputs.run_live_write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: grpc-microsoft
      - uses: actions/checkout@v5
        with:
          repository: ai-pipestream/grpc-integration
          ref: ${{ env.INTEGRATION_REF }}
          path: grpc-integration
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - name: Live Microsoft Graph write test
        working-directory: grpc-microsoft
        env:
          MICROSOFT_TENANT_ID: ${{ secrets.MICROSOFT_TENANT_ID }}
          MICROSOFT_CLIENT_ID: ${{ secrets.MICROSOFT_CLIENT_ID }}
          MICROSOFT_CLIENT_SECRET: ${{ secrets.MICROSOFT_CLIENT_SECRET }}
          MICROSOFT_SITE_ID: ${{ secrets.MICROSOFT_SITE_ID }}
          MICROSOFT_DRIVE_IDS: ${{ secrets.MICROSOFT_DRIVE_IDS }}
          MICROSOFT_LIVE_WRITE: "1"
        run: |
          ./gradlew --no-daemon -PintegrationDir=../grpc-integration :grpc-microsoft-service:liveWriteTest --rerun-tasks
      - name: Publish the report
        if: always()
        working-directory: grpc-microsoft
        run: |
          if [ -f grpc-microsoft-service/build/live-write.md ]; then
            cat grpc-microsoft-service/build/live-write.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-write
          path: |
            grpc-microsoft/grpc-microsoft-service/build/live-write.md
            grpc-microsoft/grpc-microsoft-service/build/test-results/liveWriteTest/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recordings
          path: grpc-microsoft/grpc-microsoft-service/src/test/resources/recordings/microsoft/
          if-no-files-found: ignore
