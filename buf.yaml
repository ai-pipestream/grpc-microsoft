# Buf STANDARD + COMMENTS. Lint only — codegen stays protoc /
# protobuf-gradle-plugin. The Microsoft GCA Contracts/ tree is a frozen
# MIT copy of Microsoft's wire and is not in this workspace (their lint
# bar, not ours). The protos import the shared core's ai/pipestream/sync/v1
# protos, so CI lints from a workspace holding this module and
# grpc-integration's grpc-sync-api module (see ci.yml, buf job).
version: v2
modules:
  - path: grpc-microsoft-api/src/main/proto
lint:
  use:
    - STANDARD
    - COMMENTS
breaking:
  use:
    - FILE
