syntax = "proto3";

package ai.pipestream.microsoft.v1;

import "ai/pipestream/microsoft/v1/common.proto";
import "ai/pipestream/microsoft/v1/directory.proto";
import "ai/pipestream/microsoft/v1/events.proto";
import "ai/pipestream/microsoft/v1/microsoft_service.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option java_multiple_files = true;
option java_package = "ai.pipestream.microsoft.v1";

// ============================================================================
// MICROSOFT CHANGE SERVICE - a continuous change feed and the Graph
// change-notification subscriptions that speed it up.
//
// WatchChanges runs Sync passes back to back, each followed by a read of the
// Entra users and groups when the request asks for them: one at start, then one each
// poll interval, and one early whenever a Graph change notification for a
// watched drive or list arrives, or a "missed" or "subscriptionRemoved"
// lifecycle notification. Polling is the baseline; notifications only
// shorten the wait. A pass that fails with UNAVAILABLE or RESOURCE_EXHAUSTED
// runs again from the same cursor after Graph's Retry-After or a backoff of
// at most 5 minutes. The subscription rpcs map 1:1 to Graph /subscriptions.
// The notification receiver is off unless the server is started with a
// notification port.
//
// The server keeps the subscriptions it owns alive: the ones created
// through CreateSubscription and, after a restart, the ones Graph lists
// with the server's clientState. It renews each before it expires, renews
// on a "reauthorizationRequired" lifecycle notification, and creates a
// subscription again when Graph removed it. A subscription that expires
// while the server is down is gone; polling still covers its changes.
// ListSubscriptionRenewals reports what the server keeps.
// ============================================================================

// Streams Microsoft Graph changes continuously and manages Graph change
// notification subscriptions.
service MicrosoftChangeService {
  // Runs Sync passes until the client cancels, streaming every change. Each
  // message carries the resume cursor of the last completed pass; hand it
  // back as WatchChangesRequest.resume_cursor to continue after a restart.
  rpc WatchChanges(WatchChangesRequest) returns (stream WatchChangesResponse);

  // Streams the change notifications the receiver accepts, as they arrive.
  // Answers FAILED_PRECONDITION when the receiver is off.
  rpc WatchNotifications(WatchNotificationsRequest) returns (stream WatchNotificationsResponse);

  // POST /subscriptions. Graph validates notification_url before it
  // answers, so the receiver must be reachable at that URL.
  rpc CreateSubscription(CreateSubscriptionRequest) returns (CreateSubscriptionResponse);

  // GET /subscriptions/{id}.
  rpc GetSubscription(GetSubscriptionRequest) returns (GetSubscriptionResponse);

  // GET /subscriptions. The subscriptions the calling app owns.
  rpc ListSubscriptions(ListSubscriptionsRequest) returns (ListSubscriptionsResponse);

  // PATCH /subscriptions/{id}. Renews (new expiration) or moves the
  // notification URL.
  rpc UpdateSubscription(UpdateSubscriptionRequest) returns (UpdateSubscriptionResponse);

  // POST /subscriptions/{id}/reauthorize. Answer to a
  // reauthorizationRequired lifecycle notification.
  rpc ReauthorizeSubscription(ReauthorizeSubscriptionRequest) returns (ReauthorizeSubscriptionResponse);

  // DELETE /subscriptions/{id}. The server stops renewing it.
  rpc DeleteSubscription(DeleteSubscriptionRequest) returns (DeleteSubscriptionResponse);

  // The subscriptions the server keeps alive and what it last did for each.
  // Answers FAILED_PRECONDITION when renewal is off.
  rpc ListSubscriptionRenewals(ListSubscriptionRenewalsRequest) returns (ListSubscriptionRenewalsResponse);
}

// ============================================================================
// CHANGE FEED
// ============================================================================

// Request to watch changes continuously.
message WatchChangesRequest {
  // The scope and options of every pass. Its since_cursor is the starting
  // point when resume_cursor is empty.
  SyncRequest sync = 1;
  // Resume cursor from an earlier WatchChangesResponse; empty = start from
  // sync.since_cursor.
  string resume_cursor = 2;
  // Wait between passes when no notification arrives; unset = the server
  // default (5 minutes).
  google.protobuf.Duration poll_interval = 3;
  // Shortest wait between two passes, so a burst of notifications runs one
  // pass, not many; unset = 5 seconds.
  google.protobuf.Duration min_interval = 4;
  // The Entra directory to watch next to the Sync scope; unset = none.
  DirectoryWatch directory = 5;
}

// What of the Entra directory a WatchChanges stream watches. Every pass
// reads the changes since the pass before (`/users/delta`, `/groups/delta`);
// the first pass of a stream without a resume cursor lists everything.
message DirectoryWatch {
  // Watch users. Application permission User.Read.All.
  bool users = 1;
  // Watch groups. Application permission GroupMember.Read.All.
  bool groups = 2;
  // With groups: also report the direct members added to and removed from
  // each group. The first pass then lists every direct member of every
  // group. Keep the value for the life of a resume cursor.
  bool group_members = 3;
}

// Which part of the directory a snapshot is about.
enum DirectoryKind {
  // Zero value; not set.
  DIRECTORY_KIND_UNSPECIFIED = 0;
  // Users.
  DIRECTORY_KIND_USERS = 1;
  // Groups.
  DIRECTORY_KIND_GROUPS = 2;
}

// Marker sent after a pass read the users or the groups.
message DirectorySnapshot {
  // What was read.
  DirectoryKind kind = 1;
  // CHANGE_SOURCE_CRAWL when everything was listed (the first pass, or
  // after Graph rejected the delta link): a user or group the consumer
  // holds that was not listed is gone. CHANGE_SOURCE_DELTA when only the
  // changes since the pass before were read.
  ChangeSource source = 2;
  // Changes the read emitted.
  int64 change_count = 3;
}

// What started a pass.
enum PassTrigger {
  // Zero value; not set.
  PASS_TRIGGER_UNSPECIFIED = 0;
  // The first pass of the stream.
  PASS_TRIGGER_START = 1;
  // The poll interval elapsed.
  PASS_TRIGGER_TIMER = 2;
  // A change notification for a watched resource arrived.
  PASS_TRIGGER_NOTIFICATION = 3;
}

// Marker sent after each completed pass.
message PassCompleted {
  // Pass number within this stream, from 1.
  int64 pass = 1;
  // What started the pass.
  PassTrigger trigger = 2;
  // Notifications that arrived since the previous pass started.
  int32 notification_count = 3;
  // Changes the pass emitted, user and group changes included.
  int64 change_count = 4;
  // When the pass started.
  google.protobuf.Timestamp started_at = 5;
  // When the pass completed.
  google.protobuf.Timestamp completed_at = 6;
}

// One message of the change feed.
message WatchChangesResponse {
  // Position within this stream, from 1, increasing by one per message.
  int64 sequence = 1;
  // Resume cursor of the last completed pass (an encoded SyncCursor).
  // Resuming from it replays the changes of any pass that had not
  // completed, so delivery is at least once.
  string resume_cursor = 2;
  // The streamed event.
  oneof event {
    // One entity upsert or delete. Its source is
    // CHANGE_SOURCE_NOTIFICATION when a notification started the pass.
    MicrosoftChange change = 3;
    // A completed drive or list sweep.
    MicrosoftSnapshot snapshot = 4;
    // The end of a pass.
    PassCompleted pass_completed = 5;
    // One created, changed or deleted user; only with directory.users.
    UserChange user_change = 6;
    // One created, changed or deleted group, with its member changes when
    // asked for; only with directory.groups.
    GroupChange group_change = 7;
    // The end of the users or of the groups of a pass.
    DirectorySnapshot directory_snapshot = 8;
  }
}

// Request to stream accepted change notifications.
message WatchNotificationsRequest {
  // Only notifications of this subscription; empty = all.
  string subscription_id = 1;
}

// One accepted change notification.
message WatchNotificationsResponse {
  // The notification.
  ChangeNotification notification = 1;
}

// Lifecycle event of a Graph subscription.
enum LifecycleEvent {
  // Zero value; an ordinary change notification.
  LIFECYCLE_EVENT_UNSPECIFIED = 0;
  // The subscription needs POST /reauthorize (or a renewal).
  LIFECYCLE_EVENT_REAUTHORIZATION_REQUIRED = 1;
  // Graph removed the subscription.
  LIFECYCLE_EVENT_SUBSCRIPTION_REMOVED = 2;
  // Graph dropped notifications.
  LIFECYCLE_EVENT_MISSED = 3;
}

// A Graph change notification, after the receiver verified clientState.
message ChangeNotification {
  // Graph subscription id.
  string subscription_id = 1;
  // Change type Graph reported.
  SubscriptionChangeType change_type = 2;
  // Graph resource path the notification is about.
  string resource = 3;
  // Tenant id.
  string tenant_id = 4;
  // Subscription expiration Graph reported.
  google.protobuf.Timestamp subscription_expiration_date_time = 5;
  // Lifecycle event; UNSPECIFIED for change notifications.
  LifecycleEvent lifecycle_event = 6;
  // When the receiver accepted it.
  google.protobuf.Timestamp received_at = 7;
  // Id of the changed resource (resourceData.id), when Graph sent one.
  string resource_id = 8;
}

// ============================================================================
// SUBSCRIPTIONS
// ============================================================================

// A change type a subscription can ask for.
enum SubscriptionChangeType {
  // Zero value; not set.
  SUBSCRIPTION_CHANGE_TYPE_UNSPECIFIED = 0;
  // created.
  SUBSCRIPTION_CHANGE_TYPE_CREATED = 1;
  // updated. The only type drive roots and lists support.
  SUBSCRIPTION_CHANGE_TYPE_UPDATED = 2;
  // deleted.
  SUBSCRIPTION_CHANGE_TYPE_DELETED = 3;
}

// What a subscription watches.
message SubscriptionResource {
  // The watched resource.
  oneof target {
    // /drives/{drive_id}/root.
    string drive_root = 1;
    // /sites/{site_id}/lists/{list_id}.
    ListRef list = 2;
    // /groups/{group_id}/members.
    string group_members = 3;
    // /groups/{group_id}.
    string group = 4;
    // /users/{user_id}.
    string user = 5;
    // Any other Graph resource path, sent as given.
    string path = 6;
  }
}

// A Graph change notification subscription.
message Subscription {
  // Graph subscription id.
  string id = 1;
  // The watched resource as Graph reports it.
  string resource = 2;
  // Change types.
  repeated SubscriptionChangeType change_types = 3;
  // Where Graph posts change notifications.
  string notification_url = 4;
  // Where Graph posts lifecycle notifications; empty = none.
  string lifecycle_notification_url = 5;
  // When the subscription expires.
  google.protobuf.Timestamp expiration_date_time = 6;
  // App that created the subscription.
  string application_id = 7;
  // Principal that created the subscription.
  string creator_id = 8;
  // Whether notifications carry resource data.
  bool include_resource_data = 9;
  // Lowest TLS version the notification endpoint supports.
  string latest_supported_tls_version = 10;
  // App id Graph uses to sign notification validation tokens.
  string notification_url_app_id = 11;
}

// Request for POST /subscriptions. The server sets clientState from its
// own configuration, so it never travels in a request.
message CreateSubscriptionRequest {
  // Catalog connection; empty = the process default.
  string connection_id = 1;
  // What to watch.
  SubscriptionResource resource = 2;
  // Change types; drive roots and lists support only UPDATED.
  repeated SubscriptionChangeType change_types = 3;
  // Public HTTPS URL of the receiver's notification path.
  string notification_url = 4;
  // Public HTTPS URL of the receiver's lifecycle path; empty = none.
  string lifecycle_notification_url = 5;
  // Requested expiration; unset = the longest Graph allows for the
  // resource.
  google.protobuf.Timestamp expiration_date_time = 6;
  // Sends Prefer: includesecuritywebhooks, so permission changes on drive
  // items notify too (SharePoint and OneDrive for Business).
  bool include_security_webhooks = 7;
}

// Response to CreateSubscription.
message CreateSubscriptionResponse {
  // The created subscription.
  Subscription subscription = 1;
}

// Request for GET /subscriptions/{id}.
message GetSubscriptionRequest {
  // Catalog connection; empty = the process default.
  string connection_id = 1;
  // Subscription id.
  string subscription_id = 2;
}

// Response to GetSubscription.
message GetSubscriptionResponse {
  // The subscription.
  Subscription subscription = 1;
}

// Request for GET /subscriptions.
message ListSubscriptionsRequest {
  // Catalog connection; empty = the process default.
  string connection_id = 1;
}

// Response to ListSubscriptions.
message ListSubscriptionsResponse {
  // Every subscription the app owns.
  repeated Subscription subscriptions = 1;
}

// Request for PATCH /subscriptions/{id}.
message UpdateSubscriptionRequest {
  // Catalog connection; empty = the process default.
  string connection_id = 1;
  // Subscription id.
  string subscription_id = 2;
  // New expiration; unset = the longest Graph allows for the resource.
  google.protobuf.Timestamp expiration_date_time = 3;
  // New notification URL; empty = unchanged.
  string notification_url = 4;
}

// Response to UpdateSubscription.
message UpdateSubscriptionResponse {
  // The updated subscription.
  Subscription subscription = 1;
}

// Request for POST /subscriptions/{id}/reauthorize.
message ReauthorizeSubscriptionRequest {
  // Catalog connection; empty = the process default.
  string connection_id = 1;
  // Subscription id.
  string subscription_id = 2;
}

// Response to ReauthorizeSubscription.
message ReauthorizeSubscriptionResponse {}

// Request for DELETE /subscriptions/{id}.
message DeleteSubscriptionRequest {
  // Catalog connection; empty = the process default.
  string connection_id = 1;
  // Subscription id.
  string subscription_id = 2;
}

// Response to DeleteSubscription.
message DeleteSubscriptionResponse {}

// ============================================================================
// RENEWAL
// ============================================================================

// What the server did to keep a subscription alive.
enum RenewalAction {
  // Zero value; nothing was needed yet.
  RENEWAL_ACTION_UNSPECIFIED = 0;
  // Renewed because its expiration was near.
  RENEWAL_ACTION_RENEWED = 1;
  // Renewed in answer to a reauthorizationRequired lifecycle notification.
  // Renewing a subscription reauthorizes it too.
  RENEWAL_ACTION_REAUTHORIZED = 2;
  // Created again because Graph no longer had it.
  RENEWAL_ACTION_RECREATED = 3;
}

// A subscription the server keeps alive.
message SubscriptionRenewal {
  // The subscription as Graph last reported it.
  Subscription subscription = 1;
  // Catalog connection it belongs to; empty = the process default.
  string connection_id = 2;
  // When the server renews it next.
  google.protobuf.Timestamp renew_at = 3;
  // The last thing the server did for it.
  RenewalAction last_action = 4;
  // When it did that; unset when last_action is UNSPECIFIED.
  google.protobuf.Timestamp last_action_time = 5;
  // Id of the subscription this one replaced; set when last_action is
  // RECREATED.
  string replaced_subscription_id = 6;
  // Why the last attempt failed; empty when it succeeded. The server tries
  // again on its next check.
  string last_error = 7;
}

// Request for ListSubscriptionRenewals.
message ListSubscriptionRenewalsRequest {}

// Response to ListSubscriptionRenewals.
message ListSubscriptionRenewalsResponse {
  // Every subscription the server keeps alive, of every connection.
  repeated SubscriptionRenewal renewals = 1;
}
